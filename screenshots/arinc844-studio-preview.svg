<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background:#0a0f18; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111927" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
  </defs>

  <!-- Top App Navigation Bar -->
  <rect x="20" y="20" width="960" height="60" rx="8" fill="#111927" stroke="#1e293b" />
  <rect x="35" y="32" width="100" height="36" rx="6" fill="#0284c7" />
  <text x="85" y="55" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">ARINC 844</text>
  <text x="150" y="55" fill="#ffffff" font-size="16" font-weight="bold">ARINC844Forge Pro — Electronic Logbook (ELB) Studio</text>
  
  <rect x="710" y="32" width="250" height="36" rx="18" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" />
  <circle cx="730" cy="50" r="5" fill="#10b981" />
  <text x="745" y="55" fill="#34d399" font-size="12" font-weight="bold">AIRCRAFT AIRWORTHY — RELEASED</text>

  <!-- Navigation Tabs -->
  <rect x="20" y="90" width="960" height="40" rx="6" fill="#0d1522" stroke="#1e293b" />
  <text x="40" y="115" fill="#38bdf8" font-size="13" font-weight="bold">Sector Flight Log</text>
  <text x="170" y="115" fill="#94a3b8" font-size="13">Discrepancies (PIREP/MAREP)</text>
  <text x="380" y="115" fill="#94a3b8" font-size="13">MEL Deferrals</text>
  <text x="495" y="115" fill="#94a3b8" font-size="13">Airworthiness Release</text>
  <text x="660" y="115" fill="#94a3b8" font-size="13">ARINC 429 Bus</text>
  <text x="785" y="115" fill="#94a3b8" font-size="13">Compliance Auditor (10/10)</text>

  <!-- Left Card: Aircraft & Sector Summary -->
  <rect x="20" y="145" width="465" height="235" rx="8" fill="url(#cardBg)" stroke="#1e293b" />
  <text x="40" y="175" fill="#38bdf8" font-size="15" font-weight="bold">Flight Sector Summary: UAE844</text>
  <text x="40" y="205" fill="#94a3b8" font-size="13">Aircraft:</text><text x="160" y="205" fill="#ffffff" font-size="13" font-family="monospace">A6-EGA (Boeing 777-300ER)</text>
  <text x="40" y="230" fill="#94a3b8" font-size="13">City Pair:</text><text x="160" y="230" fill="#ffffff" font-size="13" font-family="monospace">OMDB (DXB) → EGLL (LHR)</text>
  <text x="40" y="255" fill="#94a3b8" font-size="13">OOOI Timings:</text><text x="160" y="255" fill="#ffffff" font-size="13" font-family="monospace">03:05 - 03:20 - 10:35 - 10:45 UTC</text>
  <text x="40" y="280" fill="#94a3b8" font-size="13">Block / Flight:</text><text x="160" y="280" fill="#ffffff" font-size="13" font-family="monospace">7.67 hrs / 7.25 hrs</text>
  <text x="40" y="305" fill="#94a3b8" font-size="13">Fuel Uplift / Burn:</text><text x="160" y="305" fill="#ffffff" font-size="13" font-family="monospace">74,500 kg / 62,300 kg (Rem: 12,200 kg)</text>
  <text x="40" y="330" fill="#94a3b8" font-size="13">Airframe Hours:</text><text x="160" y="330" fill="#ffffff" font-size="13" font-family="monospace">18,452.3 hrs (4,120 cycles)</text>
  <text x="40" y="355" fill="#94a3b8" font-size="13">Sector State:</text><text x="160" y="355" fill="#34d399" font-size="13" font-weight="bold">CLOSED_PENDING_RELEASE</text>

  <!-- Right Card: Dual Airworthiness Release -->
  <rect x="515" y="145" width="465" height="235" rx="8" fill="url(#cardBg)" stroke="#1e293b" />
  <text x="535" y="175" fill="#34d399" font-size="15" font-weight="bold">Digital Airworthiness Release (FAA AC 120-78A)</text>
  
  <rect x="535" y="195" width="425" height="75" rx="6" fill="#060910" stroke="#1e293b" />
  <text x="550" y="215" fill="#38bdf8" font-size="12" font-weight="bold">LAME Part 145 / Part 66 Release to Service (CRS)</text>
  <text x="550" y="235" fill="#cbd5e1" font-size="11">Engineer: Tariq Al-Maktoum (License: UAE-GCAA-66-8442)</text>
  <text x="550" y="255" fill="#34d399" font-size="11" font-family="monospace">DIGEST: sha256-a9b8c7e6d5c4b3a2-crs8442-valid [CERTIFIED]</text>

  <rect x="535" y="285" width="425" height="75" rx="6" fill="#060910" stroke="#1e293b" />
  <text x="550" y="305" fill="#fbbf24" font-size="12" font-weight="bold">Pilot-in-Command (PIC) Flight Acceptance</text>
  <text x="550" y="325" fill="#cbd5e1" font-size="11">Captain: Alexander Vance (License: FAA-ATPL-1844902)</text>
  <text x="550" y="345" fill="#34d399" font-size="11" font-family="monospace">DIGEST: sha256-d4e5f6a1b2c3d4e5-pic18449-valid [ACCEPTED]</text>

  <!-- Bottom Card: Technical Logbook Table -->
  <rect x="20" y="400" width="960" height="230" rx="8" fill="url(#cardBg)" stroke="#1e293b" />
  <text x="40" y="430" fill="#38bdf8" font-size="15" font-weight="bold">Active Technical Log Discrepancies &amp; MEL Deferrals</text>

  <!-- Table Header -->
  <rect x="40" y="445" width="920" height="30" fill="#1e293b" />
  <text x="50" y="465" fill="#94a3b8" font-size="11" font-weight="bold">ID</text>
  <text x="140" y="465" fill="#94a3b8" font-size="11" font-weight="bold">TYPE</text>
  <text x="210" y="465" fill="#94a3b8" font-size="11" font-weight="bold">ATA CHAPTER</text>
  <text x="320" y="465" fill="#94a3b8" font-size="11" font-weight="bold">SYSTEM</text>
  <text x="450" y="465" fill="#94a3b8" font-size="11" font-weight="bold">STATUS</text>
  <text x="580" y="465" fill="#94a3b8" font-size="11" font-weight="bold">DISPOSITION / ACTION</text>

  <!-- Row 1 -->
  <rect x="40" y="480" width="920" height="40" fill="rgba(255,255,255,0.02)" />
  <text x="50" y="505" fill="#38bdf8" font-size="12" font-family="monospace">DEF-844-01</text>
  <text x="140" y="505" fill="#93c5fd" font-size="11">PIREP</text>
  <text x="210" y="505" fill="#ffffff" font-size="11">ATA 21-31</text>
  <text x="320" y="505" fill="#cbd5e1" font-size="11">Pressure Control</text>
  <rect x="445" y="490" width="105" height="22" rx="4" fill="rgba(245, 158, 11, 0.2)" />
  <text x="455" y="506" fill="#fbbf24" font-size="11" font-weight="bold">DEFERRED MEL</text>
  <text x="580" y="505" fill="#94a3b8" font-size="11">MEL 21-31-01 Cat C (10-Day interval, exp: 2026-10-26 23:59Z)</text>

  <!-- Row 2 -->
  <rect x="40" y="525" width="920" height="40" fill="rgba(255,255,255,0.01)" />
  <text x="50" y="550" fill="#38bdf8" font-size="12" font-family="monospace">DEF-844-02</text>
  <text x="140" y="550" fill="#e5e7eb" font-size="11">MAREP</text>
  <text x="210" y="550" fill="#ffffff" font-size="11">ATA 33-41</text>
  <text x="320" y="550" fill="#cbd5e1" font-size="11">Nav Strobe Light</text>
  <rect x="445" y="535" width="85" height="22" rx="4" fill="rgba(16, 185, 129, 0.2)" />
  <text x="455" y="551" fill="#34d399" font-size="11" font-weight="bold">RECTIFIED</text>
  <text x="580" y="550" fill="#94a3b8" font-size="11">Replaced strobe power supply P/N 33-41-01-A per AMM 33-41-00</text>

  <!-- Footer Banner -->
  <rect x="40" y="575" width="920" height="40" rx="4" fill="#060910" stroke="#1e293b" />
  <text x="55" y="600" fill="#38bdf8" font-size="12" font-family="monospace">ARINC 429 BUS: Word232=0xB008EC9A | Word233=0xB014B09B | Normative Audit: 10/10 PASS</text>
</svg>
